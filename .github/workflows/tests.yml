name: tests

# PR-only is intentional: adding a branch-push trigger would run the same suite
# twice for every open PR. Manual runs remain available through workflow_dispatch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest run for a branch or pull request. This avoids spending
# runner minutes on commits that have already been superseded.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opencli-bridge:
    name: OpenCLI bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/opencli-browser-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/opencli-browser-mcp/package-lock.json

      # Installs @jackwener/opencli so the package-detection test verifies REAL
      # resolution (not the null/null trivial pass). --ignore-scripts is safe: the
      # published tarball already ships dist/, and the package's postinstall only
      # writes shell completions, which are irrelevant in CI.
      - name: Install bridge dependencies
        run: npm ci --ignore-scripts

      # Node's built-in test runner. These tests need NO OpenCLI daemon or browser:
      # they spin up a throwaway local HTTP server to impersonate the daemon /status,
      # so they are fully deterministic in CI.
      - name: Run bridge tests
        run: npm test

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio

      # The suite uses mocks/file-backed fixtures and does not call live APIs,
      # launch browsers, or require a database service.
      - name: Run Python unit tests
        env:
          DISCOVERY_REGISTRY_BACKEND: file
        run: python -m pytest -q

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rdtii-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rdtii-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # npm run build starts with `tsc -b`, so this gates both TypeScript and
      # the production Vite bundle without needing a browser or backend.
      - name: Typecheck and build frontend
        run: npm run build

  rust-unit:
    name: Rust sidecar tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extract_sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extract_sidecar

      # Tests that need PostgreSQL already skip when TEST_DATABASE_URL is not
      # configured; the remaining sidecar tests are deterministic and local.
      - name: Run Rust unit tests
        run: cargo test --locked
