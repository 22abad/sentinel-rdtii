MYS:
  label: Malaysia
  languages: [en, ms]
  sources:
    - name: Attorney General's Chambers of Malaysia
      base_url: https://lom.agc.gov.my
      domains: [lom.agc.gov.my]
      adapter: malaysia_lom
      source_grade: primary
      source_type: statute_portal
      languages: [en, ms]
      pillars: [6, 7]
      priority: 100
      notes: >-
        Authoritative principal-Act reprints. Verified-working PDF path pattern
        (2026-07-18): /ilims/upload/portal/akta/outputaktap/<id>_BI/<TITLE>.pdf
        e.g. Income Tax Act 1967 (Act 53) s82 record-retention. The search page
        (search.php) returns subsidiary P.U.(A) instruments; pick the principal
        Act, not the P.U.(A) order. The heavy PDFs can time out on live fetch —
        Wayback often has no archive, so download-then-ingest is the fallback.

    - name: Personal Data Protection Department
      base_url: https://www.pdp.gov.my
      domains: [pdp.gov.my, www.pdp.gov.my]
      adapter: official_index
      source_grade: primary
      source_type: regulator
      languages: [en, ms]
      pillars: [6, 7]
      search_paths:
        - /ppdpv1/en/akta/personal-data-protection-amendment-act-2024/
        - /ppdpv1/en/akta/circular-of-personal-data-protection-commissioner-no-2-2025-appointment-of-data-protection-officer/
        - /ppdpv1/en/guidelines-and-circular-on-personal-data-protection-appointment-of-data-protection-officer-dpo-and-data-breach-notification/
      include_patterns: ['(?:Act-A1727|Pekeliling-DPO-1)\.pdf']
      title_overrides:
        'Act-A1727\.pdf': Personal Data Protection (Amendment) Act 2024
        'Pekeliling-DPO-1\.pdf': Pelantikan Pegawai Perlindungan Data
      priority: 90
      notes: Official section 12A data protection officer appointment source, including DPO requirement thresholds and the PDPA Amendment Act 2024.

    - name: National Cyber Security Agency
      base_url: https://www.nacsa.gov.my
      domains: [nacsa.gov.my, www.nacsa.gov.my]
      adapter: search_engine
      source_grade: primary
      source_type: regulator
      languages: [en, ms]
      pillars: [7]
      priority: 85
      notes: Official NACSA legal page and gazette PDFs for Cyber Security Act 2024 commencement and incident notification regulations.

    - name: Companies Commission of Malaysia
      base_url: https://www.ssm.com.my
      domains: [ssm.com.my, www.ssm.com.my]
      adapter: search_engine
      source_grade: primary
      source_type: regulator
      languages: [en, ms]
      pillars: [7]
      indicators: ["7.3"]
      priority: 85
      notes: Official Companies Act 2016 text and company-record retention materials.

    - name: Malaysian Investment Development Authority (InvestMalaysia)
      base_url: https://www.investmalaysia.gov.my
      domains: [investmalaysia.gov.my, www.investmalaysia.gov.my]
      adapter: search_engine
      source_grade: secondary
      source_type: government_portal
      languages: [en, ms]
      pillars: [6]
      indicators: ["6.2"]
      priority: 80
      notes: >-
        Official .gov.my portal hosting clean tax-law PDFs. Verified-working
        (2026-07-18): /media/rsoj31eh/service-tax-act-2018.pdf — Service Tax Act
        2018 (Act 807) s24(2)(c) requires service-tax records be "kept in
        Malaysia" (explicit 6.2 local-storage evidence). Downloads reliably where
        the AGC/customs portals time out.

    - name: Ministry of Investment Trade and Industry
      base_url: https://fta.miti.gov.my
      domains: [fta.miti.gov.my]
      adapter: official_index
      source_grade: primary
      source_type: government_portal
      languages: [en, ms]
      pillars: [6]
      indicators: ["6.5"]
      search_paths: [/index.php/pages/view/tpp_cptpp]
      include_patterns: ['14\._Electronic_Commerce_\.pdf']
      title_overrides:
        '14\._Electronic_Commerce_\.pdf': Chapter 14 Electronic Commerce
      priority: 85
      notes: Official electronic commerce agreement text with an Article 14.11 cross-border transfer of information commitment.

    - name: Inland Revenue Board of Malaysia (LHDN)
      base_url: https://www.hasil.gov.my
      domains: [hasil.gov.my, www.hasil.gov.my]
      adapter: search_engine
      source_grade: primary
      source_type: government_portal
      languages: [en, ms]
      pillars: [6, 7]
      indicators: ["6.2", "7.3"]
      priority: 60
      notes: Official tax authority portal hosting the Income Tax Act 1967 (record-keeping/retention duties) — cited by the UN hackathon official Pillar 6/7 portal list.

    - name: Royal Malaysia Police CCID
      base_url: https://ccid.rmp.gov.my
      domains: [ccid.rmp.gov.my]
      adapter: search_engine
