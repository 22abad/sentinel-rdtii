AUS:
  label: Australia
  languages: [en]
  sources:
    - name: Federal Register of Legislation
      base_url: https://www.legislation.gov.au
      domains: [legislation.gov.au, www.legislation.gov.au]
      adapter: australia_legislation
      source_grade: primary
      source_type: statute_portal
      languages: [en]
      pillars: [6, 7]
      priority: 100
      notes: Official Australian legislation register; verified for Privacy Act 1988 and Telecommunications (Interception and Access) Act 1979.

    - name: Department of Foreign Affairs and Trade
      base_url: https://www.dfat.gov.au
      domains: [dfat.gov.au, www.dfat.gov.au]
      adapter: official_index
      source_grade: primary
      source_type: government_portal
      languages: [en]
      pillars: [6]
      indicators: ["6.5"]
      search_paths: [/trade/services-and-digital-trade/australia-and-singapore-digital-economy-agreement]
      include_patterns: ['australia-singapore-digital-economy-agreement\.pdf']
      title_overrides:
        'australia-singapore-digital-economy-agreement\.pdf': Australia-Singapore Digital Economy Agreement
      priority: 90
      notes: Official treaty texts and digital economy agreement pages for binding data flow commitments.

    - name: Australia–Singapore DEA text (hosted by MTI Singapore)
      base_url: https://www.mti.gov.sg
      domains: [mti.gov.sg, www.mti.gov.sg, isomer-user-content.by.gov.sg]
      adapter: official_index
      source_grade: primary
      source_type: government_portal
      languages: [en]
      pillars: [6]
      indicators: ["6.5"]
      search_paths: [/trade-international-economic-relations/agreements/digital-economy-agreements-dea/sadea/]
      include_patterns: ['australia-singapore-digital-economy-agreement.*\.pdf']
      title_overrides:
        'australia-singapore-digital-economy-agreement.*\.pdf': Australia-Singapore Digital Economy Agreement
      priority: 89
      notes: The in-force Australia–Singapore DEA is a JOINT instrument whose authoritative text is published by Singapore's MTI (isomer CDN) — listed under AUS because it evidences Australia's 6.5 binding data-flow commitment; the DFAT entry above covers the same treaty from the Australian side.

    - name: Office of the Australian Information Commissioner
      base_url: https://www.oaic.gov.au
      domains: [oaic.gov.au, www.oaic.gov.au]
      adapter: search_engine
      source_grade: primary
      source_type: regulator
      languages: [en]
      pillars: [7]
      indicators: ["7.4"]
      priority: 90
      notes: Official privacy impact assessment rules and guidance.

    - name: Department of Home Affairs (Cyber Security)
      base_url: https://www.homeaffairs.gov.au
      domains: [homeaffairs.gov.au, www.homeaffairs.gov.au]
      adapter: search_engine
      source_grade: primary
      source_type: government_portal
      languages: [en]
      pillars: [7]
      indicators: ["7.2"]
      priority: 60
      notes: Official cyber security policy portal (2023-2030 Australian Cyber Security Strategy) — cited by the UN hackathon official Pillar 6/7 portal list.

