status_definitions:
  unresearched: No official instrument has been assessed yet.
  source_identified: At least one official instrument or government document is recorded.
  live_discovered: The target was returned by a live official-source search.
  text_fetched: Official text was fetched successfully but is not covered by a passing smoke case.
  smoke_verified: Live discovery, official text fetch, and indicator validation passed the smoke contract.
  manual_review_required: Automation cannot prove the negative or scope conclusion required by the indicator.
