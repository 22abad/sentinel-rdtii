services:
  postgres:
    image: pgvector/pgvector:pg17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdtii_user -d rdtii"]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: rdtii-postgres
    environment:
      POSTGRES_DB: rdtii
      POSTGRES_USER: rdtii_user
      POSTGRES_PASSWORD: rdtii_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./rdtii-database/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: rdtii-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: rdtii-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000
      DATABASE_URL: postgresql://rdtii_user:rdtii_password@postgres:5432/rdtii
      JWT_SECRET: rdtii-hackathon-secret-change-in-production
      EXTRACT_SIDECAR_URL: http://extract-sidecar:4000
      # Ollama on host — Docker Desktop auto-resolves host.docker.internal
      # On Linux, the extra_hosts entry provides the same mapping.
      RDTII_LLM_PROVIDER: deepseek
      # Big statutes (150K+ chars ≈ 180 chunks) took ~5 min at concurrency 5;
      # DeepSeek handles 12 parallel chunk calls comfortably.
      RDTII_CHUNK_CONCURRENCY: "12"
      RAG_CHAT_PROVIDER: ${RAG_CHAT_PROVIDER:-deepseek}
      DEEPSEEK_MODEL: deepseek-v4-flash
      OLLAMA_MODEL: qwen2.5:14b
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      # Vertex AI — project + location from .env (gitignored)
      GOOGLE_APPLICATION_CREDENTIALS: /etc/gcp-vertex-key.json
    volumes:
      - ./ai-service:/app
      # KNOWN-baseline law corpus, read-only. The code resolves it at /data/…
      # (repo root); without this mount the container has no local fallback, so
      # a blocked/anti-bot portal (e.g. sso.agc.gov.sg returning its banner)
      # sinks extraction even though the text is committed in the repo.
      - ./data:/data:ro
      - ~/.config/opencode/gcp-vertex-key.json:/etc/gcp-vertex-key.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      extract-sidecar:
        condition: service_healthy
    restart: on-failure

  extract-sidecar:
    build:
      context: ./extract_sidecar
      dockerfile: Dockerfile
    container_name: rdtii-extract-sidecar
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rdtii_user:rdtii_password@postgres:5432/rdtii
      SIDECAR_ADDR: 0.0.0.0:4000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./rdtii-frontend
      dockerfile: Dockerfile
    container_name: rdtii-frontend
    ports:
      - "5173:80"
    depends_on:
      ai-service:
        condition: service_started

  # stn CLI — on-demand, not started by `up` (profile "cli"). Talks to the
  # ai-service container over the compose network.
  #   docker compose run --rm stn status
  #   docker compose run --rm stn discovery SGP
  #   docker compose run --rm -it stn tui
  # (or `make stn ARGS="status"`)
  stn:
    build:
      context: ./tools/stn-cli
      dockerfile: Dockerfile
    image: rdtii-stn
    profiles: ["cli"]
    env_file:
      - .env
    environment:
      STN_API: http://ai-service:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ai-service
    restart: "no"
    # persist login across runs so `stn login` survives --rm
    volumes:
      - stn-config:/root/.config/stn

volumes:
  redis-data:
  postgres_data:
  stn-config:
