[project]
name = "stn-cli"
version = "0.1.0"
description = "SENTINEL command-line interface — operate discovery, RAG, and the knowledge base from the terminal."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "textual>=1.0",
]

[project.scripts]
stn = "stn_cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stn_cli*"]
