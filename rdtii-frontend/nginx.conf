server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Legal PDFs (especially scanned gazettes) routinely exceed nginx's 1m
  # default — a 2MB upload came back 413 and silently killed the whole
  # canvas prepare flow (parse + country detect + ingest).
  client_max_body_size 100m;

  location /api/ {
    proxy_pass http://ai-service:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /auth/ {
    proxy_pass http://ai-service:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://ai-service:8000;
    proxy_set_header Host $host;
  }

  location /providers/ {
    proxy_pass http://ai-service:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
